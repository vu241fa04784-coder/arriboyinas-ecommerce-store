<!DOCTYPE html>
<html>
<head>
    <title>Order Success - Arriboyina's</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
            rgba(15,23,42,0.75),
            rgba(15,23,42,0.85)),
            url('https://i.pinimg.com/736x/75/f6/4d/75f64d4a726393e84bb0873b6ef02d9e.jpg');

            background-size:cover;
            background-position:center;

            color:white;
        }

        .box{

            width:700px;
            padding:50px;

            border-radius:35px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(15px);

            text-align:center;

            box-shadow:
            0 10px 35px rgba(0,0,0,0.4);
        }

        .icon{
            font-size:90px;
            margin-bottom:20px;
        }

        h1{
            color:#22c55e;
            font-size:52px;
            margin-bottom:25px;
        }

        p{
            font-size:24px;
            color:#e2e8f0;
            line-height:1.9;
        }

        button{

            margin-top:35px;

            background:
            linear-gradient(
            to right,
            #06b6d4,
            #3b82f6);

            border:none;

            color:white;

            padding:18px 35px;

            border-radius:18px;

            font-size:22px;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }

    </style>
</head>

<body>

<div class="box">

<div class="icon">
✅
</div>

<h1>
Order Placed Successfully
</h1>

<p>

🙏 Thank You for Shopping at
<b>Arriboyina's</b>

<br><br>



<br><br>

We truly appreciate your trust in Arriboyina's ❤️

</p>

<a href="/">

<button>
Continue Shopping
</button>

</a>

</div>

</body>
</html>
