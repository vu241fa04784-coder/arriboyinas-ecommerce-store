<!DOCTYPE html>
<html>
<head>
    <title>Payment - Arriboyina's</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(
            rgba(15,23,42,0.75),
            rgba(15,23,42,0.85)),
            url('https://i.pinimg.com/736x/75/f6/4d/75f64d4a726393e84bb0873b6ef02d9e.jpg');

            background-size:cover;
            background-position:center;

            color:white;
        }

        /* NAVBAR */

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:20px 70px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(12px);
        }

        .logo{
            font-size:38px;
            font-weight:bold;
            color:#facc15;
        }

        .nav-links a{
            text-decoration:none;
            color:white;
            margin-left:30px;
            font-size:20px;
        }

        /* TITLE */

        h1{
            text-align:center;
            color:#facc15;
            font-size:55px;
            margin-top:40px;
        }

        /* PAYMENT BOX */

        .payment-box{

            width:650px;
            margin:50px auto;

            padding:40px;

            border-radius:30px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(15px);

            box-shadow:
            0 10px 35px rgba(0,0,0,0.4);
        }

        .option{

            background:
            rgba(255,255,255,0.08);

            padding:20px;
            border-radius:20px;

            margin:20px 0;

            font-size:22px;
        }

        input{
            margin-right:10px;
            transform:scale(1.3);
        }

        /* BUTTON */

        button{

            width:100%;

            background:
            linear-gradient(
            to right,
            #06b6d4,
            #3b82f6);

            border:none;

            color:white;

            padding:18px;

            border-radius:18px;

            font-size:22px;

            cursor:pointer;

            margin-top:30px;

            transition:0.3s;
        }

        button:hover{
            transform:scale(1.03);
        }

    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        🛒 Arriboyina's
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/cart/">Cart</a>
    </div>

</div>

<h1>
💳 Payment Method
</h1>

<div class="payment-box">

<form action="/order-success/" method="GET">

<div class="option">
<input type="radio" name="payment" checked>
📱 UPI Payment (PhonePe / GPay / Paytm)
</div>

<div class="option">
<input type="radio" name="payment">
💳 Credit / Debit Card
</div>

<div class="option">
<input type="radio" name="payment">
🚚 Cash on Delivery
</div>

<button type="submit">
Place Order
</button>

</form>

</div>

</body>
</html>
