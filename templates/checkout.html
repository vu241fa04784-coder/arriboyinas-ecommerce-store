<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>

        body{
            font-family:Arial;
            background:#eef5ff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:50px;
            border-radius:25px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        h1{
            color:green;
            margin-bottom:20px;
        }

        a{
            text-decoration:none;
        }

        button{
            background:orange;
            border:none;
            padding:15px 25px;
            border-radius:12px;
            font-size:20px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="box">

    <h1>✅ Order Placed Successfully!</h1>

    <p>Thank you for shopping.</p>

    <br>

    <a href="/">
        <button>Go Home</button>
    </a>

</div>

</body>
</html>
